name: Build & Publish Standalone Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SUBCAST-STUDIO-macOS-Standalone
          - os: windows-latest
            artifact_name: SUBCAST-STUDIO-Windows-Standalone

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "SUBCAST STUDIO" \
            --add-data "static:static" \
            --collect-all edge_tts \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            server.py
          cd dist
          zip -r "../${{ matrix.artifact_name }}.zip" "SUBCAST STUDIO.app"

      - name: Build standalone app with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onedir \
            --name "SUBCAST-STUDIO" \
            --add-data "static;static" \
            --collect-all edge_tts \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            server.py
          powershell Compress-Archive -Path "dist/SUBCAST-STUDIO" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
